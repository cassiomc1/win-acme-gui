name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore WinAcmeGui.sln
      - name: Test and build
        # dotnet test already compiles the solution; a separate build step would redo the work.
        run: dotnet test WinAcmeGui.sln --configuration Release --no-restore
      - name: Dependency vulnerability audit (Linux TFM graph)
        shell: bash
        # The SDK exits non-zero when vulnerable packages are reported; pipefail propagates it.
        run: |
          set -o pipefail
          dotnet list "$GITHUB_WORKSPACE/WinAcmeGui.sln" package --vulnerable --include-transitive | tee vulnerability-audit.txt
